<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เซียมซี บ้านหมื่นมงคล • 萬吉堂 • บ่วงปอตึ้ง</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Noto+Serif+Thai:wght@300;400;600;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --gold:#D4A017; --gold-light:#F5D76E; --gold-dark:#8B6914;
  --crimson:#8B0000; --crimson-light:#C0392B;
  --ink:#1A1008; --parchment:#F5ECD7; --parchment-dark:#E8D5A3;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#0D0806;
  font-family:'Noto Serif Thai',serif;
  min-height:100vh;
  overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 60% 40% at 50% 0%,rgba(139,0,0,.3) 0%,transparent 70%),
    radial-gradient(ellipse 40% 60% at 80% 80%,rgba(212,160,23,.15) 0%,transparent 60%),
    #0D0806;
  z-index:0;pointer-events:none;
}

/* ── Page header ── */
.page-header{
  position:relative;z-index:10;text-align:center;
  padding:36px 20px 26px;
  border-bottom:2px solid rgba(212,160,23,.3);
  background:linear-gradient(180deg,rgba(139,0,0,.45) 0%,transparent 100%);
}
.header-emblem{font-size:44px;line-height:1;margin-bottom:6px;filter:drop-shadow(0 0 20px rgba(212,160,23,.8));}
.header-title-th{
  font-family:'Noto Serif Thai',serif;font-size:clamp(22px,5vw,40px);
  font-weight:700;color:var(--gold-light);
  text-shadow:0 0 30px rgba(212,160,23,.6),2px 2px 4px rgba(0,0,0,.8);
  letter-spacing:4px;margin-bottom:4px;
}
.header-title-zh{
  font-family:'Noto Serif SC',serif;font-size:clamp(14px,3vw,24px);
  font-weight:600;color:#E07070;
  text-shadow:0 0 20px rgba(192,57,43,.5);letter-spacing:8px;margin-bottom:2px;
}
.header-subtitle{font-size:13px;color:rgba(212,160,23,.55);letter-spacing:3px;}
.header-divider{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:14px;}
.header-divider::before,.header-divider::after{
  content:'';flex:1;max-width:200px;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
}
.header-divider span{color:var(--gold);font-size:18px;}

/* ── Controls ── */
.controls{
  position:relative;z-index:10;
  display:flex;flex-wrap:wrap;justify-content:center;
  gap:8px;padding:16px 20px;
}
.btn{
  padding:8px 20px;background:transparent;
  border:1px solid var(--gold-dark);color:var(--gold-light);
  font-family:'Noto Serif Thai',serif;font-size:13px;cursor:pointer;
  transition:all .3s;letter-spacing:1px;position:relative;overflow:hidden;
}
.btn:hover{border-color:var(--gold);color:var(--gold);background:rgba(212,160,23,.1);}
.btn.active{background:rgba(212,160,23,.2);border-color:var(--gold);color:var(--gold);}
.filter-label{color:rgba(212,160,23,.5);font-size:12px;letter-spacing:2px;display:flex;align-items:center;padding:0 8px;}

/* ── Grid ── */
.grid{
  position:relative;z-index:10;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:20px;padding:16px 20px 60px;
  max-width:1400px;margin:0 auto;
}

/* ── Card ── */
.card{
  position:relative;
  aspect-ratio:2/3.4;
  cursor:pointer;
  transition:transform .4s cubic-bezier(.175,.885,.32,1.275);
}
.card:hover{transform:translateY(-8px) scale(1.02);}
.card:hover .card-glow{opacity:1;}

.card-glow{
  position:absolute;inset:-4px;border-radius:2px;
  background:radial-gradient(ellipse at center,rgba(212,160,23,.4),transparent 70%);
  opacity:0;transition:opacity .4s;pointer-events:none;z-index:-1;
}

.card-inner{
  position:relative;width:100%;height:100%;
  background:var(--parchment);
  border:3px solid var(--gold-dark);
  overflow:hidden;
  box-shadow:inset 0 0 60px rgba(139,0,0,.06),0 8px 40px rgba(0,0,0,.6),0 0 0 1px rgba(212,160,23,.2);
}

    rgba(0,0,0,0.0) 100%

}

/* Parchment wash over lower half for text readability */
.card-bg-wash{
  position:absolute;inset:0;
  background:linear-gradient(
    to bottom,
    transparent 0%,
    transparent 38%,
    rgba(245,236,215,0.82) 58%,
    rgba(245,236,215,0.97) 75%,
    var(--parchment) 100%
  );
}

/* Subtle diagonal linen texture */
.card-texture{
  position:absolute;inset:0;
  background-image:repeating-linear-gradient(
    45deg,transparent,transparent 28px,rgba(212,160,23,.025) 28px,rgba(212,160,23,.025) 29px
  ),repeating-linear-gradient(
    -45deg,transparent,transparent 28px,rgba(212,160,23,.025) 28px,rgba(212,160,23,.025) 29px
  );
}

/* ── Decorative border frame ── */
.card-frame{position:absolute;inset:8px;border:1px solid rgba(212,160,23,.4);pointer-events:none;}
.card-frame::before,.card-frame::after{content:'';position:absolute;width:18px;height:18px;border-color:var(--gold);}
.card-frame::before{top:-2px;left:-2px;border-top:2px solid;border-left:2px solid;}
.card-frame::after{bottom:-2px;right:-2px;border-bottom:2px solid;border-right:2px solid;}
.card-frame-b::before,.card-frame-b::after{content:'';position:absolute;width:18px;height:18px;border-color:var(--gold);}
.card-frame-b::before{top:-2px;right:-2px;border-top:2px solid;border-right:2px solid;}
.card-frame-b::after{bottom:-2px;left:-2px;border-bottom:2px solid;border-left:2px solid;}

/* ── Top banner ── */
.card-top-banner{
  position:relative;z-index:5;
  background:linear-gradient(135deg,rgba(139,0,0,.88) 0%,rgba(80,0,0,.92) 100%);
  border-bottom:2px solid var(--gold-dark);
  padding:9px 10px 7px;text-align:center;
  backdrop-filter:blur(2px);
}
.banner-th{font-family:'Noto Serif Thai',serif;font-size:12px;font-weight:700;color:var(--gold-light);letter-spacing:2px;text-shadow:0 1px 3px rgba(0,0,0,.5);}
.banner-zh{font-family:'Noto Serif SC',serif;font-size:10px;font-weight:600;color:rgba(245,215,110,.75);letter-spacing:4px;margin-top:1px;}

/* ── Slip number ── */
.slip-number{
  position:relative;z-index:5;
  display:flex;align-items:center;justify-content:center;
  padding:10px 0 6px;gap:8px;
}
.slip-number::before,.slip-number::after{
  content:'';flex:1;height:1px;margin:0 10px;
  background:linear-gradient(90deg,transparent,rgba(212,160,23,.5),transparent);
}
.slip-num-circle{
  width:42px;height:42px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold) 0%,var(--gold-dark) 100%);
  border:2px solid var(--gold-light);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 10px rgba(212,160,23,.4),inset 0 1px 2px rgba(255,255,255,.3);
  flex-shrink:0;
}
.slip-num-circle span{font-family:'Cinzel Decorative',serif;font-size:14px;font-weight:700;color:var(--ink);}

/* ── Level badge ── */
.slip-level{position:relative;z-index:5;text-align:center;margin-bottom:4px;}
.level-pill{display:inline-block;padding:2px 14px;font-family:'Noto Serif Thai',serif;font-size:11px;font-weight:600;letter-spacing:2px;border-radius:20px;}
.level-สูง  {background:rgba(26,92,58,.18);color:#3a8a3a;border:1px solid rgba(76,175,80,.4);}
.level-ดี   {background:rgba(212,160,23,.18);color:var(--gold-dark);border:1px solid rgba(212,160,23,.4);}
.level-กลาง {background:rgba(30,100,150,.18);color:#2060a0;border:1px solid rgba(100,181,246,.4);}
.level-ต่ำ  {background:rgba(139,0,0,.18);color:#a02020;border:1px solid rgba(200,80,80,.4);}
.level-ปาน  {background:rgba(80,80,80,.15);color:#606060;border:1px solid rgba(150,150,150,.4);}
.tones-text{font-size:9px;color:rgba(139,105,20,.65);letter-spacing:1px;margin-top:2px;}

.divider-ornament{position:relative;z-index:5;text-align:center;font-size:12px;color:rgba(212,160,23,.55);letter-spacing:4px;margin:2px 0;}

/* ── Verse sections ── */
.verse-section{position:relative;z-index:5;padding:5px 14px;}
.verse-line{font-family:'Noto Serif Thai',serif;font-size:10.5px;color:#2a1505;line-height:1.75;text-align:center;font-weight:500;}

.card-sep{position:relative;z-index:5;height:1px;background:linear-gradient(90deg,transparent,rgba(212,160,23,.35),transparent);margin:4px 14px;}

.chinese-section{position:relative;z-index:5;padding:3px 14px 6px;text-align:center;}
.chinese-label{font-family:'Noto Serif SC',serif;font-size:8px;color:rgba(139,0,0,.55);letter-spacing:3px;margin-bottom:3px;}
.chinese-line{font-family:'Noto Serif SC',serif;font-size:11px;font-weight:600;color:var(--crimson);line-height:1.75;letter-spacing:1px;}

.card-seal{position:relative;z-index:5;text-align:center;padding:4px 0 8px;}
.seal-circle{
  display:inline-flex;align-items:center;justify-content:center;
  width:32px;height:32px;border-radius:50%;
  border:2px solid rgba(139,0,0,.45);
  color:rgba(139,0,0,.55);
  font-family:'Noto Serif SC',serif;font-size:13px;font-weight:700;
}

/* ── Modal ── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.87);z-index:100;
  display:none;align-items:center;justify-content:center;
  padding:20px;backdrop-filter:blur(6px);
}
.modal-overlay.active{display:flex;animation:fadeIn .3s ease;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.modal-card{
  position:relative;max-width:500px;width:100%;
  background:var(--parchment);
  border:3px solid var(--gold-dark);
  box-shadow:0 20px 80px rgba(0,0,0,.8),0 0 60px rgba(212,160,23,.2);
  animation:slideUp .4s cubic-bezier(.175,.885,.32,1.275);
  overflow:hidden;
}
@keyframes slideUp{from{transform:translateY(40px) scale(.95);opacity:0}to{transform:none;opacity:1}}

.modal-close{
  position:absolute;top:10px;right:10px;z-index:10;
  width:30px;height:30px;
  background:rgba(139,0,0,.85);border:1px solid var(--gold-dark);
  color:var(--gold-light);cursor:pointer;font-size:16px;
  display:flex;align-items:center;justify-content:center;transition:background .2s;
}
.modal-close:hover{background:var(--crimson);}

/* Modal image panel */
.modal-img-panel{
  width:100%;height:220px;overflow:hidden;position:relative;
  border-bottom:2px solid var(--gold-dark);
}
.modal-img-panel img{
  width:100%;height:100%;object-fit:cover;object-position:center 20%;
  filter:contrast(1.08) saturate(0.85) sepia(0.1) brightness(1.03);
}
.modal-img-overlay{
  position:absolute;inset:0;
  background:linear-gradient(to bottom,rgba(139,0,0,.35) 0%,transparent 50%,rgba(245,236,215,.6) 100%);
}
.modal-img-title{
  position:absolute;top:0;left:0;right:0;
  background:linear-gradient(135deg,rgba(139,0,0,.9),rgba(80,0,0,.95));
  border-bottom:2px solid var(--gold-dark);
  padding:10px 40px 8px;text-align:center;
}
.modal-img-title .b-th{font-family:'Noto Serif Thai',serif;font-size:13px;font-weight:700;color:var(--gold-light);letter-spacing:3px;}
.modal-img-title .b-zh{font-family:'Noto Serif SC',serif;font-size:10px;color:rgba(245,215,110,.75);letter-spacing:5px;margin-top:1px;}

.modal-body{padding:18px 24px 22px;}
.modal-num{font-family:'Cinzel Decorative',serif;font-size:10px;color:var(--gold-dark);letter-spacing:3px;}
.modal-title-th{font-family:'Noto Serif Thai',serif;font-size:20px;font-weight:700;color:var(--crimson);margin:3px 0;}
.modal-sep{height:1px;background:linear-gradient(90deg,transparent,var(--gold-dark),transparent);margin:10px 0;}
.modal-section-label{font-size:9px;color:var(--gold-dark);letter-spacing:3px;margin-bottom:5px;font-weight:600;}
.modal-thai-verse{font-family:'Noto Serif Thai',serif;font-size:14px;line-height:2;color:#3a2010;}
.modal-chinese-verse{font-family:'Noto Serif SC',serif;font-size:15px;line-height:2;color:var(--crimson);font-weight:600;letter-spacing:1px;}
.modal-pinyin{font-size:10px;color:#888;font-style:italic;line-height:1.8;margin-top:4px;}
.btn-print{
  margin-top:14px;width:100%;padding:9px;
  background:linear-gradient(135deg,var(--crimson),#5C0000);
  border:1px solid var(--gold-dark);color:var(--gold-light);
  font-family:'Noto Serif Thai',serif;font-size:13px;cursor:pointer;letter-spacing:2px;
  transition:all .3s;
}
.btn-print:hover{background:linear-gradient(135deg,#A00000,var(--crimson));}

@media(max-width:600px){
  .grid{grid-template-columns:repeat(2,1fr);gap:10px;padding:10px;}
  .verse-line{font-size:9.5px;}
  .chinese-line{font-size:10px;}
}
@media print{
  body{background:white;}
  .controls,.page-header,.modal-overlay{display:none!important;}
  .grid{grid-template-columns:repeat(3,1fr);gap:10px;padding:8px;}
  .card{break-inside:avoid;}
}
</style>
</head>

function getLevelClass(lv){
  if(lv.includes('สูง')) return 'level-สูง';
  if(lv==='ดี') return 'level-ดี';
  if(lv.includes('กลาง')) return 'level-กลาง';
  if(lv==='ต่ำ') return 'level-ต่ำ';
  return 'level-ปาน';
}

function buildCard(slip){
  const div=document.createElement('div');
  div.className='card';
  div.dataset.level=slip.level;
  div.onclick=()=>openModal(slip);
  div.innerHTML=`
    <div class="card-glow"></div>
    <div class="card-inner">
      <!-- Real image background -->
      <div class="card-bg-img"></div>
      <div class="card-bg-wash"></div>
      <div class="card-texture"></div>
      <div class="card-frame"></div>
      <div class="card-frame card-frame-b"></div>

      <div class="card-top-banner">
        <div class="banner-th">🏮 บ้านหมื่นมงคล 🏮</div>
        <div class="banner-zh">萬吉堂 • 哪吒三太子 • บ่วงปอตึ้ง</div>
      </div>

      <div class="slip-number">
        <div class="slip-num-circle"><span>${slip.num}</span></div>
      </div>

      <div class="slip-level">
        <div class="level-pill ${getLevelClass(slip.level)}">ดวง${slip.level}</div>
        <div class="tones-text">${slip.tones}</div>
      </div>

      <div class="divider-ornament">❧ ✦ ❧</div>

      <div class="verse-section">
        <div class="verse-line">${slip.thai.join('<br>')}</div>
      </div>

      <div class="card-sep"></div>

      <div class="chinese-section">
        <div class="chinese-label">簽 詩</div>
        <div class="chinese-line">${slip.chinese.join('<br>')}</div>
      </div>

      <div class="card-seal"><div class="seal-circle">吉</div></div>
    </div>`;
  return div;
}

function openModal(slip){
  document.getElementById('modal-body').innerHTML=`
    <div class="modal-num">ใบที่ / 第 ${slip.num} 签</div>
    <div class="modal-title-th">ดวง${slip.level} — ${slip.tones}</div>
    <div class="modal-sep"></div>
    <div class="modal-section-label">【ภาษาไทย】</div>
    <div class="modal-thai-verse">${slip.thai.join('<br>')}</div>
    <div class="modal-sep"></div>
    <div class="modal-section-label">【汉语】</div>
    <div class="modal-chinese-verse">${slip.chinese.join('<br>')}</div>
    <div class="modal-pinyin">${slip.pinyin}</div>
    <button class="btn-print" onclick="window.print()">🖨️ พิมพ์ใบนี้ / 打印此签</button>`;
  document.getElementById('modal').classList.add('active');
}

function closeModal(e){ if(e.target===document.getElementById('modal')) closeModalDirect(); }
function closeModalDirect(){ document.getElementById('modal').classList.remove('active'); }

function filterCards(lv,e){
  document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  document.querySelectorAll('.card').forEach(c=>{
    c.style.display=(lv==='all'||c.dataset.level.includes(lv))?'':'none';
  });
}

const grid=document.getElementById('grid');
slips.forEach(s=>grid.appendChild(buildCard(s)));
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModalDirect(); });
</script>
