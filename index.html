<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เซียมซี บ้านหมื่นมงคล • 萬吉堂 • บ่วงปอตึ้ง</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Noto+Serif+Thai:wght@300;400;600;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #D4A017;
    --gold-light: #F5D76E;
    --gold-dark: #8B6914;
    --crimson: #8B0000;
    --crimson-light: #C0392B;
    --jade: #1A5C3A;
    --jade-light: #27AE60;
    --ink: #1A1008;
    --parchment: #F5ECD7;
    --parchment-dark: #E8D5A3;
    --cloud: rgba(255,255,255,0.08);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0D0806;
    font-family: 'Noto Serif Thai', serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Starfield background ── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 50% 0%, rgba(139,0,0,0.3) 0%, transparent 70%),
      radial-gradient(ellipse 40% 60% at 80% 80%, rgba(212,160,23,0.15) 0%, transparent 60%),
      radial-gradient(ellipse 50% 50% at 20% 60%, rgba(26,92,58,0.2) 0%, transparent 60%),
      #0D0806;
    z-index: 0;
    pointer-events: none;
  }

  /* ── Page header ── */
  .page-header {
    position: relative; z-index: 10;
    text-align: center;
    padding: 40px 20px 30px;
    border-bottom: 2px solid rgba(212,160,23,0.3);
    background: linear-gradient(180deg, rgba(139,0,0,0.4) 0%, transparent 100%);
  }

  .header-emblem {
    font-size: 48px;
    line-height: 1;
    margin-bottom: 8px;
    filter: drop-shadow(0 0 20px rgba(212,160,23,0.8));
  }

  .header-title-th {
    font-family: 'Noto Serif Thai', serif;
    font-size: clamp(24px, 5vw, 42px);
    font-weight: 700;
    color: var(--gold-light);
    text-shadow: 0 0 30px rgba(212,160,23,0.6), 2px 2px 4px rgba(0,0,0,0.8);
    letter-spacing: 4px;
    margin-bottom: 4px;
  }

  .header-title-zh {
    font-family: 'Noto Serif SC', serif;
    font-size: clamp(16px, 3vw, 26px);
    font-weight: 600;
    color: var(--crimson-light);
    text-shadow: 0 0 20px rgba(192,57,43,0.5);
    letter-spacing: 8px;
    margin-bottom: 2px;
  }

  .header-subtitle {
    font-family: 'Noto Serif Thai', serif;
    font-size: 14px;
    color: rgba(212,160,23,0.6);
    letter-spacing: 3px;
  }

  .header-divider {
    display: flex; align-items: center; justify-content: center;
    gap: 16px; margin-top: 16px;
  }
  .header-divider::before,
  .header-divider::after {
    content: ''; flex: 1; max-width: 200px;
    height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .header-divider span { color: var(--gold); font-size: 20px; }

  /* ── Controls ── */
  .controls {
    position: relative; z-index: 10;
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 10px; padding: 20px;
  }

  .btn {
    padding: 10px 24px;
    background: transparent;
    border: 1px solid var(--gold-dark);
    color: var(--gold-light);
    font-family: 'Noto Serif Thai', serif;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.3s;
    letter-spacing: 1px;
    position: relative;
    overflow: hidden;
  }
  .btn::before {
    content: ''; position: absolute; inset: 0;
    background: var(--gold); opacity: 0; transition: opacity 0.3s;
  }
  .btn:hover::before { opacity: 0.15; }
  .btn:hover { border-color: var(--gold); color: var(--gold); }
  .btn.active { background: rgba(212,160,23,0.2); border-color: var(--gold); color: var(--gold); }

  /* ── Grid ── */
  .grid {
    position: relative; z-index: 10;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 24px;
    padding: 20px 24px 60px;
    max-width: 1400px;
    margin: 0 auto;
  }

  /* ── Card ── */
  .card {
    position: relative;
    aspect-ratio: 2/3.2;
    cursor: pointer;
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    transform-style: preserve-3d;
  }
  .card:hover { transform: translateY(-8px) scale(1.02); }
  .card:hover .card-glow { opacity: 1; }

  .card-glow {
    position: absolute; inset: -4px;
    border-radius: 2px;
    background: radial-gradient(ellipse at center, rgba(212,160,23,0.4), transparent 70%);
    opacity: 0;
    transition: opacity 0.4s;
    pointer-events: none;
    z-index: -1;
  }

  .card-inner {
    position: relative;
    width: 100%; height: 100%;
    background: var(--parchment);
    border: 3px solid var(--gold-dark);
    overflow: hidden;
    box-shadow:
      inset 0 0 60px rgba(139,0,0,0.08),
      0 8px 40px rgba(0,0,0,0.6),
      0 0 0 1px rgba(212,160,23,0.2);
  }

  /* ── Nezha background illustration ── */
  .card-bg {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }

  /* SVG Nezha warrior illustration */
  .nezha-art {
    position: absolute;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 85%;
    opacity: 0.18;
    filter: sepia(1) saturate(0.5);
    pointer-events: none;
  }

  /* Decorative background layers */
  .card-bg-gradient {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 100%, rgba(139,0,0,0.12) 0%, transparent 70%),
      radial-gradient(ellipse 60% 40% at 50% 20%, rgba(212,160,23,0.08) 0%, transparent 60%);
  }

  /* Cloud pattern */
  .card-clouds {
    position: absolute; inset: 0;
    opacity: 0.06;
    background-image:
      radial-gradient(circle 40px at 20% 30%, var(--crimson) 0%, transparent 100%),
      radial-gradient(circle 30px at 80% 25%, var(--crimson) 0%, transparent 100%),
      radial-gradient(circle 25px at 50% 70%, var(--gold-dark) 0%, transparent 100%);
  }

  /* Flame aura behind Nezha */
  .card-aura {
    position: absolute;
    bottom: 10%; left: 50%; transform: translateX(-50%);
    width: 70%; height: 60%;
    background: radial-gradient(ellipse at 50% 80%,
      rgba(212,160,23,0.15) 0%,
      rgba(139,0,0,0.08) 40%,
      transparent 70%);
    filter: blur(20px);
  }

  /* Lotus pattern */
  .lotus-pattern {
    position: absolute;
    width: 100%; height: 100%;
    background-image: repeating-linear-gradient(
      45deg,
      transparent,
      transparent 30px,
      rgba(212,160,23,0.03) 30px,
      rgba(212,160,23,0.03) 31px
    ),
    repeating-linear-gradient(
      -45deg,
      transparent,
      transparent 30px,
      rgba(212,160,23,0.03) 30px,
      rgba(212,160,23,0.03) 31px
    );
  }

  /* ── Decorative border frame ── */
  .card-frame {
    position: absolute; inset: 8px;
    border: 1px solid rgba(212,160,23,0.35);
    pointer-events: none;
  }
  .card-frame::before, .card-frame::after {
    content: ''; position: absolute;
    width: 20px; height: 20px;
    border-color: var(--gold);
  }
  .card-frame::before {
    top: -2px; left: -2px;
    border-top: 2px solid; border-left: 2px solid;
  }
  .card-frame::after {
    bottom: -2px; right: -2px;
    border-bottom: 2px solid; border-right: 2px solid;
  }
  .card-frame-corners::before, .card-frame-corners::after {
    content: ''; position: absolute;
    width: 20px; height: 20px;
    border-color: var(--gold);
  }
  .card-frame-corners::before {
    top: -2px; right: -2px;
    border-top: 2px solid; border-right: 2px solid;
  }
  .card-frame-corners::after {
    bottom: -2px; left: -2px;
    border-bottom: 2px solid; border-left: 2px solid;
  }

  /* ── Top banner ── */
  .card-top-banner {
    position: relative; z-index: 5;
    background: linear-gradient(135deg, var(--crimson) 0%, #5C0000 100%);
    border-bottom: 2px solid var(--gold-dark);
    padding: 10px 12px 8px;
    text-align: center;
  }

  .banner-th {
    font-family: 'Noto Serif Thai', serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--gold-light);
    letter-spacing: 2px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    line-height: 1.3;
  }

  .banner-zh {
    font-family: 'Noto Serif SC', serif;
    font-size: 11px;
    font-weight: 600;
    color: rgba(245,215,110,0.8);
    letter-spacing: 4px;
    margin-top: 2px;
  }

  /* ── Slip number badge ── */
  .slip-number {
    position: relative; z-index: 5;
    display: flex; align-items: center; justify-content: center;
    padding: 12px 0 8px;
    gap: 10px;
  }
  .slip-number::before, .slip-number::after {
    content: ''; flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(212,160,23,0.5), transparent);
    margin: 0 12px;
  }

  .slip-num-circle {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
    border: 2px solid var(--gold-light);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 10px rgba(212,160,23,0.4), inset 0 1px 2px rgba(255,255,255,0.3);
    flex-shrink: 0;
  }
  .slip-num-circle span {
    font-family: 'Cinzel Decorative', serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1;
  }

  /* ── Level badge ── */
  .slip-level {
    position: relative; z-index: 5;
    text-align: center;
    margin-bottom: 6px;
  }
  .level-pill {
    display: inline-block;
    padding: 3px 16px;
    font-family: 'Noto Serif Thai', serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 2px;
    border-radius: 20px;
  }
  .level-สูง   { background: rgba(26,92,58,0.2);  color: #4CAF50; border: 1px solid rgba(76,175,80,0.4); }
  .level-ดี    { background: rgba(212,160,23,0.2); color: var(--gold); border: 1px solid rgba(212,160,23,0.4); }
  .level-กลาง  { background: rgba(30,100,150,0.2); color: #64B5F6; border: 1px solid rgba(100,181,246,0.4); }
  .level-ต่ำ   { background: rgba(139,0,0,0.2);   color: #EF5350; border: 1px solid rgba(239,83,80,0.4); }
  .level-ปานกลาง { background: rgba(80,80,80,0.2); color: #BDBDBD; border: 1px solid rgba(189,189,189,0.4); }

  .tones-text {
    font-size: 10px;
    color: rgba(212,160,23,0.5);
    letter-spacing: 1px;
    margin-top: 3px;
  }

  /* ── Divider dragon ── */
  .divider-ornament {
    position: relative; z-index: 5;
    text-align: center;
    font-size: 14px;
    color: rgba(212,160,23,0.5);
    letter-spacing: 4px;
    margin: 4px 0;
    line-height: 1;
  }

  /* ── Thai verse ── */
  .verse-section {
    position: relative; z-index: 5;
    padding: 8px 16px;
  }

  .verse-label {
    font-family: 'Noto Serif Thai', serif;
    font-size: 9px;
    color: rgba(212,160,23,0.5);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .verse-line {
    font-family: 'Noto Serif Thai', serif;
    font-size: 11.5px;
    color: var(--ink);
    line-height: 1.7;
    text-align: center;
  }

  /* ── Separator ── */
  .card-sep {
    position: relative; z-index: 5;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(212,160,23,0.3), transparent);
    margin: 6px 16px;
  }

  /* ── Chinese verse ── */
  .chinese-section {
    position: relative; z-index: 5;
    padding: 4px 16px 8px;
    text-align: center;
  }

  .chinese-label {
    font-family: 'Noto Serif SC', serif;
    font-size: 9px;
    color: rgba(139,0,0,0.6);
    letter-spacing: 3px;
    margin-bottom: 4px;
  }

  .chinese-line {
    font-family: 'Noto Serif SC', serif;
    font-size: 12px;
    font-weight: 600;
    color: var(--crimson);
    line-height: 1.8;
    letter-spacing: 1px;
  }

  /* ── Bottom seal ── */
  .card-seal {
    position: relative; z-index: 5;
    text-align: center;
    padding: 6px 0 10px;
  }
  .seal-circle {
    display: inline-flex; align-items: center; justify-content: center;
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 2px solid rgba(139,0,0,0.4);
    color: rgba(139,0,0,0.5);
    font-family: 'Noto Serif SC', serif;
    font-size: 14px;
    font-weight: 700;
  }

  /* ── Modal ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 100;
    display: none;
    align-items: center; justify-content: center;
    padding: 20px;
    backdrop-filter: blur(6px);
  }
  .modal-overlay.active { display: flex; animation: fadeIn 0.3s ease; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal-card {
    position: relative;
    max-width: 480px; width: 100%;
    background: var(--parchment);
    border: 3px solid var(--gold-dark);
    box-shadow: 0 20px 80px rgba(0,0,0,0.8), 0 0 60px rgba(212,160,23,0.2);
    animation: slideUp 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
    overflow: hidden;
  }

  @keyframes slideUp { from { transform: translateY(40px) scale(0.95); opacity: 0; } to { transform: none; opacity: 1; } }

  .modal-close {
    position: absolute; top: 12px; right: 12px; z-index: 10;
    width: 32px; height: 32px;
    background: rgba(139,0,0,0.8);
    border: 1px solid var(--gold-dark);
    color: var(--gold-light);
    cursor: pointer; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
  }
  .modal-close:hover { background: var(--crimson); }

  .modal-body { padding: 20px 24px 24px; }

  .modal-num { font-family: 'Cinzel Decorative', serif; font-size: 11px; color: var(--gold-dark); letter-spacing: 3px; }
  .modal-title-th { font-family: 'Noto Serif Thai', serif; font-size: 22px; font-weight: 700; color: var(--crimson); margin: 4px 0; }
  .modal-level { font-size: 14px; color: var(--gold-dark); font-weight: 600; margin-bottom: 12px; }

  .modal-sep { height: 1px; background: linear-gradient(90deg, transparent, var(--gold-dark), transparent); margin: 12px 0; }

  .modal-section-label { font-size: 10px; color: var(--gold-dark); letter-spacing: 3px; margin-bottom: 6px; font-weight: 600; }

  .modal-thai-verse { font-family: 'Noto Serif Thai', serif; font-size: 15px; line-height: 2; color: #3A2010; }
  .modal-chinese-verse { font-family: 'Noto Serif SC', serif; font-size: 16px; line-height: 2; color: var(--crimson); font-weight: 600; letter-spacing: 1px; }
  .modal-pinyin { font-size: 11px; color: #888; font-style: italic; line-height: 1.8; margin-top: 6px; }

  /* Print button */
  .btn-print {
    margin-top: 16px; width: 100%;
    padding: 10px;
    background: linear-gradient(135deg, var(--crimson), #5C0000);
    border: 1px solid var(--gold-dark);
    color: var(--gold-light);
    font-family: 'Noto Serif Thai', serif;
    font-size: 14px; cursor: pointer; letter-spacing: 2px;
    transition: all 0.3s;
  }
  .btn-print:hover { background: linear-gradient(135deg, #A00000, var(--crimson)); }

  /* Filter controls */
  .filter-label {
    color: rgba(212,160,23,0.5);
    font-size: 12px;
    letter-spacing: 2px;
    display: flex; align-items: center;
    padding: 0 10px;
  }

  /* SVG Nezha warrior */
  .nezha-svg { width: 100%; height: 100%; }

  @media print {
    body { background: white; }
    .controls, .page-header, .modal-overlay { display: none !important; }
    .grid { grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 10px; }
    .card { break-inside: avoid; }
  }

  @media (max-width: 600px) {
    .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 12px; }
    .verse-line { font-size: 10px; }
    .chinese-line { font-size: 11px; }
  }
</style>
</head>
<body>

<!-- Page Header -->
<header class="page-header">
  <div class="header-emblem">⚡🔥🌸</div>
  <div class="header-title-th">บ้านหมื่นมงคล</div>
  <div class="header-title-zh">萬吉堂 • 哪吒三太子</div>
  <div class="header-subtitle">บ่วงปอตึ้ง • 萬吉堂簽詩</div>
  <div class="header-divider"><span>✦</span></div>
</header>

<!-- Controls -->
<div class="controls">
  <span class="filter-label">กรอง:</span>
  <button class="btn active" onclick="filterCards('all')">ทั้งหมด (27)</button>
  <button class="btn" onclick="filterCards('สูง')">🟢 สูง</button>
  <button class="btn" onclick="filterCards('ดี')">🟡 ดี</button>
  <button class="btn" onclick="filterCards('กลาง')">🔵 กลาง</button>
  <button class="btn" onclick="filterCards('ต่ำ')">🔴 ต่ำ</button>
</div>

<!-- Cards Grid -->
<div class="grid" id="grid"></div>

<!-- Modal -->
<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal-card" id="modal-card">
    <button class="modal-close" onclick="closeModalDirect()">✕</button>
    <div style="background:linear-gradient(135deg,var(--crimson),#5C0000);padding:16px 24px;border-bottom:2px solid var(--gold-dark);">
      <div style="font-family:'Noto Serif Thai',serif;font-size:14px;font-weight:700;color:var(--gold-light);letter-spacing:3px;">บ้านหมื่นมงคล</div>
      <div style="font-family:'Noto Serif SC',serif;font-size:11px;color:rgba(245,215,110,0.7);letter-spacing:5px;margin-top:2px;">萬吉堂 • 哪吒三太子</div>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
const slips = [
  { num:1, level:"สูง", tones:"กลาง กลาง กลาง",
    thai:["กลางสามหนช่วยดลให้ศักดิ์สิทธิ์","เทพผู้ทรงฤทธิ์ ชักนำช่วยรักษา","ให้สมรักสมหวัง สำเร็จเจตนา","สมอุราแล้วอย่าลืมมาตอบแทน"],
    chinese:["三度居中神力显，","天神护佑引吉祥。","心愿得偿情志满，","莫忘还愿报神恩。"],
    pinyin:"Sān dù jū zhōng shén lì xiǎn, tiān shén hù yòu yǐn jí xiáng. Xīn yuàn dé cháng qíng zhì mǎn, mò wàng huán yuàn bào shén ēn."},
  { num:2, level:"สูง", tones:"หงาย หงาย หงาย",
    thai:["สามหงายสบายใจ หายเดือดร้อน","จงผันผ่อนตามเวลาให้เหมาะสม","เทพชูช่วยรวยทรัพย์ไม่อับจน","ผลบุญตนส่งมาชะตาดี"],
    chinese:["三仰心安热恼消，","顺时而行莫性急。","神明佑助财源广，","福德因缘命运佳。"],
    pinyin:"Sān yǎng xīn ān rè nǎo xiāo, shùn shí ér xíng mò xìng jí. Shén míng yòu zhù cái yuán guǎng, fú dé yīn yuán mìng yùn jiā."},
  { num:3, level:"ต่ำ", tones:"คว่ำ คว่ำ คว่ำ",
    thai:["ความทุกข์ยากลำบากอยู่ข้างหน้า","หมองพักตรากลุ้มจิตให้ผิดหวัง","ด้วยโชคร้ายสุดเหลียว เปลี่ยนชีวัน","เหลือกำลังดาวเคราะห์พอเหมาะมี"],
    chinese:["前路坎坷苦难多，","愁眉苦脸心灰暗。","厄运当头运势低，","星煞虽重尚有余。"],

// Generate Nezha SVG as warrior background
function nezhaWarriorSVG(num) {
  const seed = num * 137;
  const flameH = 60 + (seed % 30);
  return `
  <svg viewBox="0 0 200 340" xmlns="http://www.w3.org/2000/svg" class="nezha-svg">
    <defs>
      <radialGradient id="aura${num}" cx="50%" cy="70%" r="50%">
        <stop offset="0%" stop-color="#D4A017" stop-opacity="0.5"/>
        <stop offset="50%" stop-color="#8B0000" stop-opacity="0.2"/>
        <stop offset="100%" stop-color="#8B0000" stop-opacity="0"/>
      </radialGradient>
      <filter id="glow${num}">
        <feGaussianBlur stdDeviation="2" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    <!-- Aura halo -->
    <ellipse cx="100" cy="240" rx="70" ry="100" fill="url(#aura${num})"/>

    <!-- Lotus platform -->
    <ellipse cx="100" cy="305" rx="55" ry="14" fill="#D4A017" opacity="0.6"/>
    <ellipse cx="100" cy="300" rx="48" ry="10" fill="#F5D76E" opacity="0.4"/>
    <!-- Lotus petals -->
    ${[0,45,90,135,180,225,270,315].map((a,i) => {
      const rad = a * Math.PI/180;
      const px = 100 + Math.cos(rad)*44;
      const py = 300 + Math.sin(rad)*11;
      return `<ellipse cx="${px}" cy="${py}" rx="10" ry="5" fill="#D4A017" opacity="0.5" transform="rotate(${a},${px},${py})"/>`;
    }).join('')}

function getLevelClass(level) {
  if (level.includes('สูง')) return 'level-สูง';
  if (level === 'ดี') return 'level-ดี';
  if (level.includes('กลาง')) return 'level-กลาง';
  if (level === 'ต่ำ') return 'level-ต่ำ';
  return 'level-ปานกลาง';
}

function buildCard(slip) {
  const div = document.createElement('div');
  div.className = 'card';
  div.dataset.level = slip.level;
  div.onclick = () => openModal(slip);

  div.innerHTML = `
    <div class="card-glow"></div>
    <div class="card-inner">
      <div class="card-bg">
        <div class="lotus-pattern"></div>
        <div class="card-bg-gradient"></div>
        <div class="card-aura"></div>
        <div class="card-clouds"></div>
        <div class="nezha-art">${nezhaWarriorSVG(slip.num)}</div>
      </div>

      <div class="card-frame"></div>
      <div class="card-frame card-frame-corners"></div>

      <!-- Top Banner -->
      <div class="card-top-banner">
        <div class="banner-th">🏮 บ้านหมื่นมงคล 🏮</div>
        <div class="banner-zh">萬吉堂 • 哪吒三太子 • บ่วงปอตึ้ง</div>
      </div>

      <!-- Number -->
      <div class="slip-number">
        <div class="slip-num-circle"><span>${slip.num}</span></div>
      </div>

      <!-- Level -->
      <div class="slip-level">
        <div class="level-pill ${getLevelClass(slip.level)}">ดวง${slip.level}</div>
        <div class="tones-text">${slip.tones}</div>
      </div>

      <div class="divider-ornament">❧ ✦ ❧</div>

      <!-- Thai verse -->
      <div class="verse-section">
        <div class="verse-line">
          ${slip.thai.map(l => l).join('<br>')}
        </div>
      </div>

      <div class="card-sep"></div>

      <!-- Chinese verse -->
      <div class="chinese-section">
        <div class="chinese-label">簽 詩</div>
        <div class="chinese-line">
          ${slip.chinese.map(l => l).join('<br>')}
        </div>
      </div>

      <!-- Bottom seal -->
      <div class="card-seal">
        <div class="seal-circle">吉</div>
      </div>
    </div>
  `;
  return div;
}

function openModal(slip) {
  const body = document.getElementById('modal-body');
  body.innerHTML = `
    <div class="modal-num">ใบที่ / 第 ${slip.num} 签</div>
    <div class="modal-title-th">ดวง${slip.level} — ${slip.tones}</div>
    <div class="modal-sep"></div>
    <div class="modal-section-label">【ภาษาไทย】THAI VERSE</div>
    <div class="modal-thai-verse">${slip.thai.join('<br>')}</div>
    <div class="modal-sep"></div>
    <div class="modal-section-label">【汉语】CHINESE VERSE</div>
    <div class="modal-chinese-verse">${slip.chinese.join('<br>')}</div>
    <div class="modal-pinyin">${slip.pinyin}</div>
    <button class="btn-print" onclick="window.print()">🖨️ พิมพ์ใบนี้ / 打印此签</button>
  `;
  document.getElementById('modal').classList.add('active');
}

function closeModal(e) {
  if (e.target === document.getElementById('modal')) closeModalDirect();
}
function closeModalDirect() {
  document.getElementById('modal').classList.remove('active');
}

let currentFilter = 'all';
function filterCards(level) {
  currentFilter = level;
  document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  document.querySelectorAll('.card').forEach(card => {
    const cardLevel = card.dataset.level;
    if (level === 'all' || cardLevel.includes(level)) {
      card.style.display = '';
    } else {
      card.style.display = 'none';
    }
  });
}

// Build all cards
const grid = document.getElementById('grid');
slips.forEach(slip => grid.appendChild(buildCard(slip)));

// Keyboard close
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModalDirect();
});
</script>
